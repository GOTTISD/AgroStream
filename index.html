<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroStream – Monitoreo Agrosatelital</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%231e293b'/%3E%3Cpath d='M 50 14 A 36 36 0 0 1 86 50 C 72 50 40 50 14 Z' fill='%23ffffff'/%3E%3Cpath d='M 50 86 A 36 36 0 0 1 14 50 C 28 50 40 60 50 86 Z' fill='%2338bdf8'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Librerías de Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --side:#0f172a; --side2:#1e293b; --bg:#f8fafc; --card:#ffffff;
  --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --soft:#f1f5f9;
  --brand-primary:#0284c7; --mint:#10b981; --amber:#d97706; --cb:#fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

.navbar-top { background: var(--side); color: #fff; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.08); }
.nav-container { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; }
.brand { display: flex; gap: 12px; align-items: center; }
.logo-container { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #0369a1); display: grid; place-items: center; }
.brand b { font-size: 19px; color: #f8fafc; }
.brand small { font-size: 10px; letter-spacing: .12em; color: #38bdf8; font-weight: 700; display: block; }

nav.top-nav-links { display: flex; gap: 10px; align-items: center; }
nav.top-nav-links a { width: 44px; height: 44px; border-radius: 10px; color: #cbd5e1; display: flex; align-items: center; justify-content: center; text-decoration: none; }
nav.top-nav-links a.on { background: var(--brand-primary); color: #fff; }
nav.top-nav-links svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

.user-settings-dropdown { position: relative; }
.gear-btn { width: 44px; height: 44px; border-radius: 10px; background: var(--side2); border: 1px solid rgba(255,255,255,0.1); color: #fff; display: grid; place-items: center; cursor: pointer; }
.dropdown-menu { position: absolute; top: calc(100% + 10px); right: 0; width: 250px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: none; flex-direction: column; gap: 10px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.dropdown-menu.show { display: flex; }
.dropdown-item { padding: 8px; background: transparent; border: none; text-align: left; cursor: pointer; font: 500 14px Outfit; color: var(--ink); }
.dropdown-item.logout { color: #dc2626; }

main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; padding: 18px 30px; background: var(--card); border-bottom: 1px solid var(--line); }
.wrap { padding: 30px; }
.card { background: var(--card); border-radius: 18px; padding: 24px; border: 1px solid var(--line); margin-bottom: 24px; }

#map-wrapper { width: 100%; height: 500px; position: relative; border-radius: 14px; overflow: hidden; }
#map-container { width: 100%; height: 100%; }

/* PANTALLA DE LOGIN OVERLAY */
#lg { position: fixed; inset: 0; z-index: 500; background: var(--side); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lc { background: var(--card); border-radius: 20px; padding: 36px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
.lc h2 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }
.lc label { display: block; font-size: 13px; font-weight: 500; color: var(--mut); margin-top: 14px; }
.lc input { width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: 15px Outfit; background: var(--soft); }
.lc .btn { width: 100%; justify-content: center; margin-top: 20px; padding: 12px; background: var(--brand-primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
.err { color: #dc2626; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
.forgot-pass { display: block; text-align: right; font-size: 13px; color: var(--brand-primary); margin-top: 8px; text-decoration: none; cursor: pointer; }
.forgot-pass:hover { text-decoration: underline; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--side); color: #fff; padding: 12px 22px; border-radius: 10px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 600; }
.toast.on { opacity: 1; }
</style>
</head>
<body>

<!-- OVERLAY DE LOGIN -->
<div id="lg">
  <form class="lc" onsubmit="loginFirebase(event)">
    <div class="logo-container" style="margin: 0 auto 16px;">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" fill="#1e293b"/><path d="M 50 14 A 36 36 0 0 1 86 50 C 72 50 40 50 14 Z" fill="#ffffff"/><path d="M 50 86 A 36 36 0 0 1 14 50 C 28 50 40 60 50 86 Z" fill="#38bdf8"/></svg>
    </div>
    <h2>AgroStream</h2>
    <p style="text-align:center;font-size:13px;color:var(--mut)">Validación de Credenciales Firebase</p>
    
    <label>Correo Electrónico</label>
    <input id="email-input" type="email" placeholder="samsalgadojaraba25@gmail.com" required>
    
    <label>Contraseña</label>
    <input id="pass-input" type="password" placeholder="••••••••" required>
    
    <a class="forgot-pass" onclick="recuperarClave()">¿Olvidaste tu contraseña?</a>

    <div class="err" id="login-error"></div>
    <button class="btn" type="submit">Iniciar Sesión</button>
  </form>
</div>

<!-- BARRA SUPERIOR -->
<header class="navbar-top">
  <div class="nav-container">
    <div class="brand">
      <div class="logo-container">
        <svg width="26" height="26" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" fill="#1e293b"/><path d="M 50 14 A 36 36 0 0 1 86 50 C 72 50 40 50 14 Z" fill="#ffffff"/><path d="M 50 86 A 36 36 0 0 1 14 50 C 28 50 40 60 50 86 Z" fill="#38bdf8"/></svg>
      </div>
      <div><b>AgroStream</b><small>SATELITAL & IOT</small></div>
    </div>

    <nav class="top-nav-links">
      <a href="#mapa" class="on"><svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg></a>
    </nav>

    <div class="user-settings-dropdown">
      <button class="gear-btn" onclick="document.getElementById('user-dropdown').classList.toggle('show')">⚙️</button>
      <div class="dropdown-menu" id="user-dropdown">
        <div>
          <b id="user-name">Samuel Salgado Jaraba</b>
          <p id="user-email" style="font-size:12px;color:var(--mut)">samsalgadojaraba25@gmail.com</p>
          <small id="user-role" style="color:var(--brand-primary);font-weight:700">ADMINISTRADOR</small>
        </div>
        <button class="dropdown-item logout" onclick="logout()">🚪 Cerrar Sesión</button>
      </div>
    </div>
  </div>
</header>

<main>
  <header>
    <div>
      <h1>Monitoreo Satelital de Lote</h1>
      <p style="font-size:14px;color:var(--mut)">Conectado a Firebase Realtime Database & Auth</p>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h3>Geolocalización Satelital</h3>
      <div id="map-wrapper" style="margin-top:16px;">
        <div id="map-container"></div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// CONFIGURACIÓN DE TU FIREBASE (Ingresa tus llaves reales de la consola de Firebase)
const firebaseConfig = {
  apiKey: "TU_API_KEY_DE_FIREBASE",
  authDomain: "agrostream-76ce0.firebaseapp.com",
  databaseURL: "https://agrostream-76ce0-default-rtdb.firebaseio.com",
  projectId: "agrostream-76ce0"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let mapInstance = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}

// INICIAR SESIÓN CON FIREBASE AUTH
function loginFirebase(event) {
  event.preventDefault();
  const emailVal = document.getElementById('email-input').value.trim();
  const passVal = document.getElementById('pass-input').value;
  const errDiv = document.getElementById('login-error');
  errDiv.textContent = 'Iniciando sesión...';

  auth.signInWithEmailAndPassword(emailVal, passVal)
    .then((userCredential) => {
      errDiv.textContent = '';
      const user = userCredential.user;
      
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('lg').style.display = 'none';
      toast('Bienvenido, ' + (user.displayName || user.email));
      initMap();
    })
    .catch((error) => {
      console.error(error);
      errDiv.textContent = 'Correo o contraseña incorrectos.';
    });
}

// FUNCIÓN PARA ENVIAR CORREO DE RECUPERACIÓN DE CONTRASEÑA
function recuperarClave() {
  const emailVal = document.getElementById('email-input').value.trim();
  const errDiv = document.getElementById('login-error');

  if (!emailVal) {
    errDiv.textContent = 'Por favor escribe tu correo electrónico arriba para enviar las instrucciones.';
    return;
  }

  errDiv.textContent = 'Enviando correo de recuperación...';

  auth.sendPasswordResetEmail(emailVal)
    .then(() => {
      errDiv.textContent = '';
      toast('Se ha enviado un enlace a ' + emailVal + ' para restablecer tu contraseña.');
    })
    .catch((error) => {
      console.error(error);
      if (error.code === 'auth/user-not-found') {
        errDiv.textContent = 'No existe ninguna cuenta registrada con este correo.';
      } else {
        errDiv.textContent = 'Error al enviar el correo de recuperación.';
      }
    });
}

function logout() {
  auth.signOut().then(() => {
    document.getElementById('lg').style.display = 'flex';
    document.getElementById('email-input').value = '';
    document.getElementById('pass-input').value = '';
    document.getElementById('user-dropdown').classList.remove('show');
    toast('Sesión cerrada correctamente');
  });
}

function initMap() {
  if (!mapInstance && typeof L !== 'undefined') {
    mapInstance = L.map('map-container').setView([9.2451, -75.4012], 15);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri World Imagery'
    }).addTo(mapInstance);
    L.marker([9.2451, -75.4012]).addTo(mapInstance).bindPopup('<b>Lote La Esperanza</b><br>Nodo Central IoT').openPopup();
  }
}
</script>
</body>
</html>
